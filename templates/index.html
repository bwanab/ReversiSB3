<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reversi - Play Against AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reversi AI</h1>
            <p class="subtitle">Play against trained model</p>
        </header>

        <div class="game-container">
            <!-- Game Controls -->
            <div class="controls">
                <div class="control-group">
                    <label for="model-color">Model plays as:</label>
                    <select id="model-color">
                        <option value="black">Black (goes first)</option>
                        <option value="white">White (goes second)</option>
                    </select>
                </div>
                <button id="new-game-btn" class="btn btn-primary">New Game</button>
                <div class="control-group">
                    <button id="undo-btn" class="btn btn-secondary" disabled>⟲ Undo</button>
                    <button id="redo-btn" class="btn btn-secondary" disabled>⟳ Redo</button>
                </div>
            </div>

            <!-- Game Info -->
            <div class="game-info">
                <div class="score-panel">
                    <div class="score-item">
                        <span class="piece black-piece"></span>
                        <span class="score-label">Black:</span>
                        <span id="black-score" class="score-value">2</span>
                    </div>
                    <div class="score-item">
                        <span class="piece white-piece"></span>
                        <span class="score-label">White:</span>
                        <span id="white-score" class="score-value">2</span>
                    </div>
                </div>
                <div id="turn-indicator" class="turn-indicator">
                    <span id="turn-text">Click "New Game" to start</span>
                </div>
                <div id="game-status" class="game-status"></div>
            </div>

            <!-- Game Board -->
            <div class="board-container">
                <div class="board" id="board">
                    <!-- Board cells will be generated by JavaScript -->
                </div>
                <div class="board-labels">
                    <div class="labels-row">
                        <span>A</span><span>B</span><span>C</span><span>D</span>
                        <span>E</span><span>F</span><span>G</span><span>H</span>
                    </div>
                    <div class="labels-col">
                        <span>1</span><span>2</span><span>3</span><span>4</span>
                        <span>5</span><span>6</span><span>7</span><span>8</span>
                    </div>
                </div>
            </div>

            <!-- Move History / Notation -->
            <div class="move-history">
                <h3>Last Move</h3>
                <div id="last-move" class="last-move-display">-</div>
            </div>

            <!-- Game Record (shown at game end) -->
            <div id="game-record" class="game-record" style="display: none;">
                <h3>Game Record</h3>
                <div id="move-list" class="move-list"></div>
                <button id="copy-moves-btn" class="btn btn-secondary">Copy Moves</button>
            </div>
        </div>

        <footer>
            <p>ReversiSB3 - Behavioral Cloning + RL Model</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
